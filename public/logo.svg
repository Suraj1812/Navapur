<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
     viewBox="0 0 1720 512" width="1720" height="512" role="img" aria-labelledby="navapur-logo-title navapur-logo-desc">
  <title id="navapur-logo-title">Navapur — a city, a thousand stories</title>
  <desc id="navapur-logo-desc">Horizontal Navapur logo lockup: the gold arch and skyline mark beside the NAVAPUR wordmark, the Devanagari नवापुर, and the tagline “a city, a thousand stories”.</desc>
  <metadata>
    <rdf:RDF>
      <rdf:Description rdf:about="urn:navapur:brand:logo-horizontal">
        <dc:title>Navapur horizontal lockup</dc:title>
        <dc:subject>logo, lockup, wordmark, bilingual, Devanagari, Navapur, city, brand</dc:subject>
        <dc:description>Primary horizontal lockup for headers, README banners and press. Minimum width 240 px; clear space equals the height of the N.</dc:description>
        <dc:format>image/svg+xml</dc:format>
        <dc:language>en-IN</dc:language>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="lgField" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2E2A"/><stop offset="1" stop-color="#0E1917"/>
    </linearGradient>
    <linearGradient id="lgGold" x1="120" y1="90" x2="400" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEDC6"/><stop offset=".45" stop-color="#E9B875"/><stop offset="1" stop-color="#BE7C48"/>
    </linearGradient>
    <clipPath id="lgArchClip"><path d="M134 404V254c0-58 38-104 86-116l36-34 36 34c48 12 86 58 86 116v150Z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#lgField)"/>
  <g clip-path="url(#lgArchClip)">
    <circle cx="256" cy="216" r="52" fill="#8FCFC1"/>
    <g fill="url(#lgGold)">
      <rect x="140" y="312" width="48" height="96" rx="6"/>
      <rect x="196" y="256" width="56" height="152" rx="6"/>
      <rect x="260" y="290" width="42" height="118" rx="6"/>
      <rect x="310" y="272" width="58" height="136" rx="6"/>
    </g>
  </g>
  <path d="M134 404V254c0-58 38-104 86-116l36-34 36 34c48 12 86 58 86 116v150"
        fill="none" stroke="url(#lgGold)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 62 274 92h-36Z" fill="url(#lgGold)"/>
  <rect x="96" y="404" width="320" height="30" rx="15" fill="url(#lgGold)"/>

  <text x="596" y="256" fill="#13201E" font-family="'Trebuchet MS', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="132" font-weight="700" letter-spacing="20">NAVAPUR</text>
  <text x="1478" y="256" fill="#6C8B82" font-family="'Nirmala UI', 'Noto Sans Devanagari', system-ui, sans-serif" font-size="86" font-weight="600" text-anchor="end">नवापुर</text>
  <rect x="600" y="292" width="1040" height="3" rx="1.5" fill="#C9A97E"/>
  <text x="600" y="360" fill="#49665E" font-family="'Trebuchet MS', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="38" font-weight="600" letter-spacing="11">A CITY, A THOUSAND STORIES</text>
</svg>
