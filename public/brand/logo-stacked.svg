<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-labelledby="navapur-stacked-title navapur-stacked-desc">
  <title id="navapur-stacked-title">Navapur — stacked lockup</title>
  <desc id="navapur-stacked-desc">Vertical Navapur lockup: the arch mark above the NAVAPUR wordmark, the Devanagari नवापुर and the tagline. For splash screens, posters and square placements.</desc>
  <defs>
    <linearGradient id="stField" x1="104" y1="60" x2="616" y2="572" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2E2A"/><stop offset="1" stop-color="#0E1917"/>
    </linearGradient>
    <linearGradient id="stGold" x1="224" y1="150" x2="504" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEDC6"/><stop offset=".45" stop-color="#E9B875"/><stop offset="1" stop-color="#BE7C48"/>
    </linearGradient>
  </defs>
  <rect x="104" y="60" width="512" height="512" rx="112" fill="url(#stField)"/>
  <g transform="translate(104 60)">
    <circle cx="256" cy="216" r="52" fill="#8FCFC1"/>
    <g fill="url(#stGold)">
      <rect x="140" y="312" width="48" height="92" rx="6"/>
      <rect x="196" y="256" width="56" height="148" rx="6"/>
      <rect x="260" y="290" width="42" height="114" rx="6"/>
      <rect x="310" y="272" width="58" height="132" rx="6"/>
    </g>
    <path d="M134 404V254c0-58 38-104 86-116l36-34 36 34c48 12 86 58 86 116v150"
          fill="none" stroke="url(#stGold)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 62 274 92h-36Z" fill="url(#stGold)"/>
    <rect x="96" y="404" width="320" height="30" rx="15" fill="url(#stGold)"/>
  </g>
  <text x="360" y="700" text-anchor="middle" fill="#13201E" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="108" font-weight="700" letter-spacing="16">NAVAPUR</text>
  <text x="360" y="778" text-anchor="middle" fill="#6C8B82" font-family="'Nirmala UI','Noto Sans Devanagari',system-ui,sans-serif" font-size="60" font-weight="600">नवापुर</text>
  <text x="360" y="842" text-anchor="middle" fill="#49665E" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="9">A CITY, A THOUSAND STORIES</text>
</svg>
