      <stop offset="0" stop-color="#1B2E2A"/><stop offset="1" stop-color="#0E1917"/>
    </linearGradient>
    <linearGradient id="nvGold" x1="120" y1="90" x2="400" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFEDC6"/><stop offset=".45" stop-color="#E9B875"/><stop offset="1" stop-color="#BE7C48"/>
    </linearGradient>
    <linearGradient id="nvSun" x1="210" y1="160" x2="302" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9E7DA"/><stop offset="1" stop-color="#6FB6A8"/>
    </linearGradient>
    <clipPath id="nvArchClip"><path d="M134 404V254c0-58 38-104 86-116l36-34 36 34c48 12 86 58 86 116v150Z"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#nvField)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#2A4741" stroke-width="4"/>

