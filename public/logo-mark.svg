<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
     viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="navapur-mark-title navapur-mark-desc">
  <title id="navapur-mark-title">Navapur</title>
  <desc id="navapur-mark-desc">A gold torana archway framing a city skyline and a rising sun, on a deep green field — the primary Navapur logo mark.</desc>
  <metadata>
    <rdf:RDF>
      <rdf:Description rdf:about="urn:navapur:brand:logo-mark">
        <dc:title>Navapur logo mark</dc:title>
        <dc:creator>Navapur design system</dc:creator>
        <dc:subject>logo, brand mark, app icon, torana, archway, skyline, India, city, Navapur</dc:subject>
        <dc:description>Primary Navapur brand mark: a pointed torana arch framing four skyline blocks and a rising sun, drawn on a 512 grid with a 96 unit clear space.</dc:description>
        <dc:type>Image</dc:type>
        <dc:format>image/svg+xml</dc:format>
        <dc:rights>© Navapur. Use unmodified; keep 96 units of clear space on all sides.</dc:rights>
        <dc:language>en-IN</dc:language>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
