    <style>
        :root { color-scheme: dark; }
        html, body { margin: 0; height: 100%; background: #0d1614; }
        #boot {
            position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
            background: radial-gradient(circle at 50% 38%, #1d2f2b 0%, #0d1614 62%, #070c0b 100%);
            color: #e8dcc4; font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            transition: opacity .7s ease, visibility .7s;
        }
        #boot.boot--done { opacity: 0; visibility: hidden; pointer-events: none; }
        .boot-inner { text-align: center; padding: 24px; max-width: 34rem; }
        .boot-mark { font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: .1em; margin: 0 0 .35rem; font-weight: 600; color: #f2e6cd; }
        .boot-sub { margin: 0 0 2rem; color: #9db3ac; letter-spacing: .18em; font-size: .78rem; text-transform: uppercase; }
        .boot-line { width: min(280px, 70vw); height: 2px; margin: 0 auto; border-radius: 2px; overflow: hidden; background-color: #24352f; }
        .boot-line::after {
            content: ''; display: block; height: 100%; width: 40%; border-radius: 2px;
            background: linear-gradient(90deg, #2f4a42, #e0b072, #2f4a42);
            animation: boot-sweep 1.4s ease-in-out infinite;
        }
        .boot-note { margin-top: 1.4rem; font-size: .85rem; color: #7f948d; }
        @keyframes boot-sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
        @media (prefers-reduced-motion: reduce) { .boot-line::after { animation: none; width: 100%; } }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="boot" role="status" aria-live="polite">
        <div class="boot-inner">
            <p class="boot-mark">नवापुर</p>
            <p class="boot-sub">Navapur · a city, a thousand stories</p>
            <div class="boot-line"></div>
            <p class="boot-note">Building the streets, the weather and a few hundred neighbours…</p>
        </div>
    </div>
    <noscript>
        <p style="color:#e8dcc4;font-family:system-ui;padding:2rem;text-align:center">
            Navapur is a real-time 3D city and needs JavaScript enabled.
        </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
</body>
